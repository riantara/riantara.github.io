<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love U Olip ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ff4757;
            --pink: #ff6b81;
            --light-pink: #ffa8a8;
            --dark: #1a1a2e;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #2d0033 0%, #1a0020 40%, #0d0012 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
            cursor: none;
        }

        /* ── Custom cursor ── */
        .cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            font-size: 22px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            user-select: none;
        }

        /* ── Canvas background ── */
        #heartCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Main card ── */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 100, 130, 0.3);
            border-radius: 24px;
            padding: 50px 60px;
            max-width: 560px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 71, 87, 0.25), 0 0 120px rgba(255, 71, 87, 0.1);
            animation: cardFloat 4s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-14px); }
        }

        /* ── Title ── */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 8vw, 5rem);
            color: #fff;
            text-shadow:
                0 0 10px var(--red),
                0 0 30px var(--red),
                0 0 60px var(--pink);
            animation: glow 2.5s ease-in-out infinite alternate;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--red), 0 0 30px var(--red); }
            to   { text-shadow: 0 0 20px var(--red), 0 0 60px var(--pink), 0 0 100px #ff9eb5; }
        }

        /* ── Big heart ── */
        .big-heart {
            font-size: clamp(4rem, 12vw, 6.5rem);
            display: inline-block;
            margin: 18px 0;
            animation: heartbeat 1.1s ease-in-out infinite;
            filter: drop-shadow(0 0 18px var(--red));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14%       { transform: scale(1.25); }
            28%       { transform: scale(1.1); }
            42%       { transform: scale(1.3); }
            70%       { transform: scale(1); }
        }

        /* ── Love letter ── */
        .letter {
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: rgba(255, 210, 220, 0.88);
            line-height: 1.9;
            margin: 18px 0 24px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: rgba(255, 160, 170, 0.5);
            font-size: 1.1rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 107, 129, 0.4), transparent);
        }

        /* ── Countdown ── */
        .countdown-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--light-pink);
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .countdown-box {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 107, 129, 0.3);
            border-radius: 12px;
            padding: 10px 16px;
            min-width: 64px;
        }

        .countdown-box .num {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            color: #fff;
            display: block;
            text-shadow: 0 0 12px var(--red);
        }

        .countdown-box .unit {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--light-pink);
            opacity: 0.7;
        }

        /* ── Subtitle ── */
        .sub {
            margin-top: 28px;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            color: var(--light-pink);
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50%       { opacity: 1; }
        }

        /* ── Click burst hearts ── */
        .burst {
            position: fixed;
            pointer-events: none;
            font-size: 22px;
            z-index: 9998;
            animation: burstAnim 0.9s ease forwards;
            user-select: none;
        }

        @keyframes burstAnim {
            0%   { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.4); }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card { padding: 36px 28px; }
        }
    </style>
</head>
<body>

    <!-- Custom cursor -->
    <div class="cursor" id="cursor">❤️</div>

    <!-- Canvas for falling hearts -->
    <canvas id="heartCanvas"></canvas>

    <!-- Main love card -->
    <div class="card" id="card">
        <div class="title">I Love You, Olip</div>

        <div class="big-heart">❤️</div>

        <p class="letter">
            Setiap hari bersamamu terasa seperti mimpi indah<br>
            yang tidak pernah ingin aku akhiri.<br>
            Kamu adalah alasan aku tersenyum setiap pagi,<br>
            dan bintang yang selalu menemaniku di malam hari. 🌙✨
        </p>

        <div class="divider">💕</div>

        <p class="countdown-label">Bersama selama</p>
        <div class="countdown">
            <div class="countdown-box">
                <span class="num" id="cd-days">0</span>
                <span class="unit">Hari</span>
            </div>
            <div class="countdown-box">
                <span class="num" id="cd-hours">0</span>
                <span class="unit">Jam</span>
            </div>
            <div class="countdown-box">
                <span class="num" id="cd-mins">0</span>
                <span class="unit">Menit</span>
            </div>
            <div class="countdown-box">
                <span class="num" id="cd-secs">0</span>
                <span class="unit">Detik</span>
            </div>
        </div>

        <p class="sub">Forever &amp; Always 💕</p>
    </div>

    <script>
    /* ─────────────────────────────────────────
       1. Custom cursor follows mouse
    ───────────────────────────────────────── */
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top  = e.clientY + 'px';
    });

    /* ─────────────────────────────────────────
       2. Canvas falling hearts
    ───────────────────────────────────────── */
    const canvas = document.getElementById('heartCanvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const EMOJIS  = ['❤️','💕','💖','💗','💓','💝','💘','💞','🩷','🌹'];
    const COLORS  = ['#ff4757','#ff6b81','#ffa8a8','#ff9eb5','#ffccd5'];
    const particles = [];

    class Particle {
        constructor() { this.reset(true); }
        reset(initial = false) {
            this.x     = Math.random() * canvas.width;
            this.y     = initial ? Math.random() * -canvas.height : -40;
            this.size  = Math.random() * 22 + 12;
            this.speed = Math.random() * 1.5 + 0.6;
            this.drift = (Math.random() - 0.5) * 0.8;
            this.rot   = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.04;
            this.emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            this.alpha = Math.random() * 0.5 + 0.4;
        }
        update() {
            this.y   += this.speed;
            this.x   += this.drift;
            this.rot += this.rotSpeed;
            if (this.y > canvas.height + 60) this.reset();
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.font = `${this.size}px serif`;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rot);
            ctx.fillText(this.emoji, -this.size / 2, this.size / 2);
            ctx.restore();
        }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    /* ─────────────────────────────────────────
       3. Click burst effect
    ───────────────────────────────────────── */
    document.addEventListener('click', e => {
        const count = 8;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'burst';
            el.textContent = EMOJIS[Math.floor(Math.random() * 5)];
            const angle = (i / count) * Math.PI * 2;
            const dist  = Math.random() * 80 + 50;
            el.style.left = e.clientX + 'px';
            el.style.top  = e.clientY + 'px';
            el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }
    });

    /* ─────────────────────────────────────────
       4. Countdown timer  ← ganti tanggal ini
    ───────────────────────────────────────── */
    const START_DATE = new Date('2024-01-01T00:00:00');   // ← ganti sesuai tanggal mulai

    function updateCountdown() {
        const now  = new Date();
        const diff = Math.max(0, now - START_DATE);
        const totalSecs = Math.floor(diff / 1000);
        const secs  = totalSecs % 60;
        const mins  = Math.floor(totalSecs / 60) % 60;
        const hours = Math.floor(totalSecs / 3600) % 24;
        const days  = Math.floor(totalSecs / 86400);

        document.getElementById('cd-days').textContent  = days;
        document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
        document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');
        document.getElementById('cd-secs').textContent  = String(secs).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
